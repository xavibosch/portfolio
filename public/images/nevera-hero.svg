<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08100f"/>
      <stop offset="1" stop-color="#0e1a18"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <path d="M0 225 H1600 M0 450 H1600 M0 675 H1600"/>
    <path d="M400 0 V900 M800 0 V900 M1200 0 V900"/>
  </g>

  <!-- fridge -->
  <g>
    <rect x="620" y="150" width="360" height="520" rx="28" fill="#101d1b" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="620" y1="330" x2="980" y2="330" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="650" y="220" width="10" height="70" rx="5" fill="#2dd4bf" fill-opacity="0.7"/>
    <rect x="650" y="380" width="10" height="120" rx="5" fill="#2dd4bf" fill-opacity="0.7"/>
    <!-- NFC tag on the door -->
    <g transform="translate(870 470)">
      <circle r="42" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-width="2"/>
      <g fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round">
        <path d="M-12 -10 a16 16 0 0 1 24 0"/>
        <path d="M-19 -17 a26 26 0 0 1 38 0"/>
        <circle cx="0" cy="4" r="4" fill="#2dd4bf" stroke="none"/>
      </g>
    </g>
  </g>

  <!-- checklist chips -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#9ad9cf">
    <g transform="translate(1090 260)">
      <rect width="240" height="52" rx="26" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.4"/>
      <text x="52" y="33">Llet ✓</text>
    </g>
    <g transform="translate(1120 340)">
      <rect width="240" height="52" rx="26" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.4"/>
      <text x="52" y="33">Pa ✓</text>
    </g>
    <g transform="translate(1090 420)">
      <rect width="240" height="52" rx="26" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="52" y="33" fill="#e8fffb">Ous</text>
    </g>
  </g>

  <text x="800" y="770" text-anchor="middle"
        font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-weight="800" font-size="60" letter-spacing="-1" fill="#fff">
    Nevera Bosch
  </text>
  <text x="800" y="820" text-anchor="middle"
        font-family="ui-monospace, Menlo, monospace"
        font-size="17" letter-spacing="8" fill="#6d9d94">
    TAP · LIST · SYNC
  </text>
</svg>
